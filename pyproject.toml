[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigport"
version = "0.1.0"
description = "Audits portability of published gene-expression signatures across cohorts and platforms."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "typer",
    "requests",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sigport = "sigport.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
